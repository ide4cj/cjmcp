[workspace]
members = ["modules/loupe4py", "modules/server"]
# members = ["modules/loupe4py"]
build-members = []
test-members = []
compile-option = "-Woff unused"
override-compile-option = ""
link-option = ""
target-dir = ""
script-dir = ""

[replace]
loupe = { git = "https://github.com/ide4cj/cjls.git" }
fjson = { git = "https://github.com/ide4cj/cjls.git" }

[profile]
experimental = true

# `-i` on every build and test; cjpm's cache knows nothing of the SDK, hence build.cj (D27)
[profile.build]
incremental = true

[profile.test.env]
cjHeapSize = { value = "2GB", splice-type = "replace" }

# stdx is the static one, unpacked per platform as the nightly zips lay it out
[target.aarch64-apple-darwin.bin-dependencies]
path-option = [
    "${CANGJIE_STDX_PATH}"
    # "${CANGJIE_HOME}/third_party/stdx/darwin_aarch64_cjnative/static/stdx",
]

[target.x86_64-unknown-linux-gnu.bin-dependencies]
path-option = [
    "${CANGJIE_STDX_PATH}"
    # "${CANGJIE_HOME}/third_party/stdx/linux_x86_64_cjnative/static/stdx",
]

[target.x86_64-w64-mingw32.bin-dependencies]
path-option = [
    "${CANGJIE_STDX_PATH}"
    # "${CANGJIE_HOME}/third_party/stdx/windows_x86_64_cjnative/static/stdx",
]
